# Despliegue de Tri Office en Netlify.
# El runtime de Next.js lo instala Netlify automáticamente al detectar el
# framework; aquí solo se fijan el comando, el directorio y la versión de Node.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
